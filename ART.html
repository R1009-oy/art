<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js 響應式藝術互動</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    /* 移除外邊距，隱藏滾動條，確保畫布填滿螢幕 */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }
    canvas {
      display: block; /* 移除 inline 元素的底部間隙 */
    }
  </style>
</head>
<body>

<script>
let particles = [];

function setup() {
  // 建立與視窗同寬高的畫布
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  background(0);
}

function draw() {
  background(0, 8); // 微調透明度，讓尾跡更有質感

  // 互動：滑鼠移動時生成粒子
  if (mouseX > 0 && mouseY > 0) {
    if (mouseIsPressed || (mouseX !== pmouseX || mouseY !== pmouseY)) {
      for (let i = 0; i < 2; i++) {
        particles.push(new Particle(mouseX, mouseY));
      }
    }
  }

  // 倒序遍歷粒子陣列
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].show();
    if (particles[i].finished()) {
      particles.splice(i, 1);
    }
  }
}

// ✨ 響應式關鍵：當視窗大小改變時，重新調整畫布
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  background(0); // 縮放後清空一次背景，避免殘影錯位
}

class Particle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = random(-2, 2);
    this.vy = random(-2, 2);
    this.alpha = 100;
    this.hue = (frameCount % 360);
    this.size = random(10, 30);
  }

  finished() { return this.alpha < 0; }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= 1.5;
    this.size *= 0.98; // 粒子越縮越小
  }

  show() {
    noStroke();
    // 加上發光感：使用兩層圓形疊加
    fill(this.hue, 80, 100, this.alpha * 0.5);
    ellipse(this.x, this.y, this.size);
    fill(this.hue, 50, 100, this.alpha);
    ellipse(this.x, this.y, this.size * 0.5);
  }
}
</script>

</body>
</html>
